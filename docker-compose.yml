services:

  postgres:
    image: postgres:17

    container_name: workhub-postgres

    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: workhubDBpass

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest

    container_name: workhub-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  redis:
    image: redis:7-alpine

    container_name: workhub-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

  workhub:
    build:
      context: .

    container_name: workhub-app

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: workhubDBpass
      JWT_SECRET: workhub-super-secure-jwt-secret-key-123456
      MAIL_PASSWORD: qjzjxdqzdjtlqoak
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - kafka
      - redis

volumes:
  postgres-data:
  redis-data:
