name: WorkHub Build Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build WorkHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build WorkHub
        run: ./gradlew build

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t workhub:ci \
            .

      - name: Tag Docker Image
        if: github.ref == 'refs/heads/dev'
        run: |
          docker tag workhub:ci ghcr.io/${{ github.repository_owner }}/workhub:latest
          docker tag workhub:ci ghcr.io/${{ github.repository_owner }}/workhub:${{ github.sha }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/dev'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/workhub:latest
          docker push ghcr.io/${{ github.repository_owner }}/workhub:${{ github.sha }}